<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CA Roadtrip">
<meta name="theme-color" content="#1B2A3B">
<title>California Roadtrip · Patel × Panchal · May 30 – Jun 10, 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F2EA;
    --bg-elevated:#FFFFFF;
    --bg-sunken:#EFE9DE;
    --ink:#1B2A3B;
    --ink-soft:#4A5868;
    --ink-mute:#8A8275;
    --line:rgba(27,42,59,0.08);
    --line-strong:rgba(27,42,59,0.14);
    --sunset:#E26D45;
    --sunset-deep:#C8512B;
    --ocean:#2C5577;
    --ocean-deep:#1E3F5C;
    --forest:#3F634D;
    --gold:#C99441;
    --purple:#7B4F8C;
    --sand:#E8DCC6;
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  body{min-height:100dvh;overflow-x:hidden}
  .app{max-width:540px;margin:0 auto;min-height:100dvh;padding-bottom:calc(76px + var(--safe-bottom));background:var(--bg)}
  h1,h2,h3,h4,.display{font-family:'Fraunces','Georgia',serif;font-weight:600;letter-spacing:-0.01em;color:var(--ink)}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  img{max-width:100%;display:block}

  /* ---------- Top bar ---------- */
  .topbar{position:sticky;top:0;z-index:50;background:var(--bg);padding:calc(12px + var(--safe-top)) 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--sunset),var(--gold));display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px rgba(226,109,69,0.25)}
  .brand-text{display:flex;flex-direction:column;line-height:1.1}
  .brand-title{font-family:'Fraunces',serif;font-weight:700;font-size:16px}
  .brand-sub{font-size:11px;color:var(--ink-mute);letter-spacing:0.04em;text-transform:uppercase}
  .topbar-meta{font-size:11px;color:var(--ink-mute);text-align:right;letter-spacing:0.02em}

  /* ---------- Screens ---------- */
  .screen{display:none;padding:18px 16px 24px}
  .screen.active{display:block;animation:fadeUp .25s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .section-title{font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin-bottom:14px;letter-spacing:-0.01em}
  .section-sub{font-size:13px;color:var(--ink-mute);margin-top:-10px;margin-bottom:14px}

  /* ---------- Today screen ---------- */
  .hero{background:linear-gradient(160deg,var(--ocean) 0%,var(--ocean-deep) 60%, #15324A 100%);color:#fff;border-radius:22px;padding:22px;position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(30,63,92,0.25)}
  .hero::before{content:"";position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:radial-gradient(circle,var(--sunset) 0%,transparent 70%);opacity:0.35}
  .hero-eyebrow{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;opacity:.75;font-weight:600}
  .hero-title{font-family:'Fraunces',serif;font-size:36px;line-height:1.05;margin-top:6px;color:#fff;font-weight:600}
  .hero-sub{font-size:14px;opacity:.85;margin-top:8px}
  .countdown{display:flex;align-items:baseline;gap:10px;margin-top:18px}
  .countdown-num{font-family:'Fraunces',serif;font-size:72px;font-weight:700;line-height:1;color:#fff;letter-spacing:-0.02em}
  .countdown-label{font-size:13px;letter-spacing:0.08em;text-transform:uppercase;opacity:.85}

  .today-banner{background:var(--bg-elevated);border-radius:18px;padding:18px;margin-top:16px;border:1px solid var(--line);box-shadow:0 2px 12px rgba(27,42,59,0.04)}
  .today-day{display:flex;align-items:baseline;gap:10px}
  .today-day-num{font-family:'Fraunces',serif;font-weight:700;font-size:30px;color:var(--sunset)}
  .today-day-meta{font-size:12px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:0.08em}
  .today-theme{font-family:'Fraunces',serif;font-size:20px;margin-top:4px}
  .today-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .today-row:first-of-type{margin-top:10px}
  .today-row-label{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-mute);font-weight:600}
  .today-row-val{font-size:14px;font-weight:500;text-align:right}

  .checklist{background:var(--bg-elevated);border-radius:18px;padding:14px 6px;margin-top:16px;border:1px solid var(--line)}
  .checklist h3{font-family:'Fraunces',serif;font-size:17px;padding:0 12px 8px;font-weight:600}
  .check-item{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--line);align-items:flex-start;cursor:pointer}
  .check-item:first-of-type{border-top:none}
  .check-box{flex:0 0 22px;width:22px;height:22px;border-radius:7px;border:2px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;transition:all .15s}
  .check-item.done .check-box{background:var(--forest);border-color:var(--forest)}
  .check-item.done .check-text{color:var(--ink-mute);text-decoration:line-through}
  .check-text{font-size:14px;line-height:1.45;padding-top:1px}

  .quick-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--ink);color:#fff;padding:14px;border-radius:14px;font-weight:600;font-size:15px;margin-top:14px;box-shadow:0 4px 14px rgba(27,42,59,0.2)}

  /* ---------- Days screen ---------- */
  .day-pills{position:sticky;top:62px;z-index:40;background:var(--bg);padding:10px 0 12px;margin:0 -16px;border-bottom:1px solid var(--line);overflow:hidden}
  .day-pills-scroll{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
  .day-pills-scroll::-webkit-scrollbar{display:none}
  .day-pill{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--bg-sunken);font-size:12px;font-weight:600;letter-spacing:0.04em;color:var(--ink-soft);white-space:nowrap;border:1px solid transparent;position:relative}
  .day-pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .day-pill.today::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--sunset)}

  .days-carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px -16px 0;padding:0 16px;scrollbar-width:none;gap:16px}
  .days-carousel::-webkit-scrollbar{display:none}
  .day-slide{flex:0 0 calc(100% - 0px);scroll-snap-align:start;min-width:0}

  .day-header{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  .day-num{font-family:'Fraunces',serif;font-weight:700;font-size:28px;color:var(--sunset)}
  .day-date{font-size:12px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:0.08em}
  .day-theme{font-family:'Fraunces',serif;font-size:22px;line-height:1.15;margin-bottom:10px}

  .day-stats{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .stat{background:var(--bg-elevated);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;display:flex;gap:6px;align-items:center;flex:1;min-width:0}
  .stat-icon{font-size:14px}
  .stat-label{color:var(--ink-mute);font-size:10px;text-transform:uppercase;letter-spacing:0.06em;display:block;font-weight:600}
  .stat-val{font-weight:600;font-size:13px;display:block}

  .warn{background:#FFF6E6;border:1px solid #F0CD7F;border-left:4px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.5;color:#7A5A1A}
  .warn::before{content:"⚠️ ";margin-right:2px}

  .activity{background:var(--bg-elevated);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 3px rgba(27,42,59,0.03)}
  .activity-main{display:flex;gap:12px;padding:12px}
  .activity-photo{flex:0 0 100px;width:100px;height:100px;border-radius:12px;overflow:hidden;position:relative;background:var(--bg-sunken)}
  .activity-photo img{width:100%;height:100%;object-fit:cover;border-radius:12px}
  .activity-photo.fallback img{display:none}
  .activity-photo.fallback::after{content:attr(data-initials);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Fraunces',serif;font-size:28px;font-weight:600;letter-spacing:-0.02em}
  .activity-photo.type-activity{background:linear-gradient(135deg,var(--sunset),var(--ocean))}
  .activity-photo.type-hike{background:linear-gradient(135deg,var(--forest),#2A4A35)}
  .activity-photo.type-food{background:linear-gradient(135deg,var(--gold),var(--sunset))}
  .activity-photo.type-stay{background:linear-gradient(135deg,var(--purple),#3F2A55)}
  .activity-photo.type-drive{background:linear-gradient(135deg,var(--ocean),var(--ocean-deep))}
  .activity-photo.type-flight{background:linear-gradient(135deg,var(--ocean-deep),#0F2235)}
  .activity-photo.type-car{background:linear-gradient(135deg,var(--ink-soft),var(--ink))}
  .activity-photo.type-beach{background:linear-gradient(135deg,#7CB8D9,var(--ocean))}

  .activity-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .activity-time-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .activity-time{font-size:13px;font-weight:600;color:var(--ink-soft)}
  .activity-name{font-family:'Fraunces',serif;font-size:17px;font-weight:600;line-height:1.2;color:var(--ink)}
  .activity-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.45;margin-top:2px}
  .activity-meta{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-mute)}
  .activity-meta span{display:inline-flex;align-items:center;gap:3px}

  .badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px}
  .badge.must{background:#FCE5DC;color:var(--sunset-deep)}
  .badge.skip{background:var(--bg-sunken);color:var(--ink-mute)}
  .badge.gem{background:#FBEED1;color:#8B621D}
  .badge.opt{background:#EFE3F2;color:var(--purple)}
  .badge.kid{background:#DDEAE2;color:var(--forest)}

  .activity-row{padding:10px 12px;border-top:1px dashed var(--line);font-size:12.5px;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
  .activity-row-icon{font-size:14px;flex:0 0 18px}
  .activity-row-content{flex:1;min-width:0}
  .activity-row-label{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-mute);font-weight:700;margin-bottom:2px}
  .addr-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .addr-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;background:var(--bg-sunken);border-radius:8px;font-size:11.5px;font-weight:600;color:var(--ink)}
  .addr-btn:active{background:var(--line-strong)}

  .info-block{background:#F1F4F2;border-left:3px solid var(--forest);padding:12px 14px;border-radius:10px;margin:12px 0;font-size:12.5px;line-height:1.5}
  .info-block strong{color:var(--forest);font-weight:600;display:block;margin-bottom:4px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase}

  .day-summary{display:flex;gap:10px;margin-top:14px}
  .day-summary-card{flex:1;background:var(--bg-elevated);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px}
  .day-summary-label{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-mute);font-weight:700;margin-bottom:6px}
  .day-summary-val{font-family:'Fraunces',serif;font-size:14px;line-height:1.3;font-weight:500}

  /* ---------- Stays ---------- */
  .stay{background:var(--bg-elevated);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;display:flex;gap:12px}
  .stay-mark{flex:0 0 56px;width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--purple),#3F2A55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px}
  .stay.type-airbnb .stay-mark{background:linear-gradient(135deg,var(--sunset),var(--sunset-deep))}
  .stay-info{flex:1;min-width:0}
  .stay-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px;flex-wrap:wrap}
  .stay-name{font-family:'Fraunces',serif;font-size:16px;font-weight:600;line-height:1.2}
  .stay-nights{font-size:11px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;flex-shrink:0}
  .stay-dates{font-size:12.5px;color:var(--ink-soft);margin-bottom:6px}
  .stay-addr{font-size:12.5px;color:var(--ink-soft);line-height:1.4}
  .stay-conf{display:inline-block;font-size:10.5px;letter-spacing:0.06em;background:var(--bg-sunken);color:var(--ink-soft);padding:3px 7px;border-radius:6px;margin-top:8px;font-weight:600;font-family:'JetBrains Mono','SF Mono',monospace}

  /* ---------- Logistics ---------- */
  .logistics-card{background:var(--bg-elevated);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .logistics-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .logistics-icon{font-size:22px;width:42px;height:42px;border-radius:12px;background:var(--bg-sunken);display:flex;align-items:center;justify-content:center}
  .logistics-title{font-family:'Fraunces',serif;font-size:18px;font-weight:600}
  .logistics-sub{font-size:12px;color:var(--ink-mute)}
  .flight-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px;flex-wrap:wrap}
  .flight-row:first-of-type{border-top:none}
  .flight-meta{font-size:11.5px;color:var(--ink-mute);margin-top:2px}
  .flight-conf{font-family:'JetBrains Mono','SF Mono',monospace;font-size:11px;background:var(--bg-sunken);padding:2px 6px;border-radius:5px;letter-spacing:0.04em;font-weight:600}
  .car-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .car-cell{background:var(--bg-sunken);border-radius:10px;padding:10px;font-size:12px}
  .car-cell-label{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-mute);font-weight:700;margin-bottom:4px}
  .car-cell-val{font-weight:600;font-size:13px;line-height:1.3}

  /* ---------- Eats ---------- */
  .eats-search-wrap{position:sticky;top:62px;z-index:40;background:var(--bg);padding:6px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px}
  .eats-search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line-strong);background:var(--bg-elevated);font-size:14px;font-family:inherit;color:var(--ink)}
  .eats-search:focus{outline:none;border-color:var(--ocean);box-shadow:0 0 0 3px rgba(44,85,119,0.12)}
  .eats-chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
  .eats-chips::-webkit-scrollbar{display:none}
  .eats-chip{flex:0 0 auto;padding:6px 12px;border-radius:999px;background:var(--bg-sunken);font-size:12px;font-weight:600;color:var(--ink-soft);border:1px solid transparent;white-space:nowrap}
  .eats-chip.active{background:var(--ink);color:#fff}
  .eat-card{background:var(--bg-elevated);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .eat-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
  .eat-name{font-family:'Fraunces',serif;font-size:17px;font-weight:600;line-height:1.2}
  .eat-rating{font-size:12px;font-weight:700;background:var(--gold);color:#fff;padding:3px 8px;border-radius:6px;flex-shrink:0;letter-spacing:0.02em}
  .eat-meta{display:flex;gap:8px;font-size:11.5px;color:var(--ink-mute);margin:6px 0;flex-wrap:wrap;align-items:center}
  .eat-tag{background:var(--bg-sunken);padding:3px 8px;border-radius:6px;font-weight:600;color:var(--ink-soft)}
  .eat-cuisine{font-weight:600;color:var(--ocean)}
  .eat-notes{font-size:12.5px;color:var(--ink-soft);line-height:1.45;margin-top:6px}
  .eat-addr{font-size:12px;color:var(--ink-mute);margin-top:8px;line-height:1.4}
  .eats-empty{text-align:center;color:var(--ink-mute);font-size:13px;padding:30px 16px}

  /* ---------- Bottom nav ---------- */
  .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:540px;background:rgba(247,242,234,0.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + var(--safe-bottom));z-index:60}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;color:var(--ink-mute);font-size:10px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;border-radius:10px;transition:color .15s}
  .nav-btn .nav-icon{font-size:20px;line-height:1}
  .nav-btn.active{color:var(--ink)}
  .nav-btn.active .nav-icon{filter:none}

  /* ---------- Toast ---------- */
  .toast{position:fixed;bottom:calc(90px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;opacity:0;transition:all .2s ease;z-index:100;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:380px){
    .activity-photo{flex:0 0 84px;width:84px;height:84px}
    .activity-name{font-size:16px}
    .countdown-num{font-size:60px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🌴</div>
      <div class="brand-text">
        <span class="brand-title">CA Roadtrip</span>
        <span class="brand-sub">Patel × Panchal · 2026</span>
      </div>
    </div>
    <div class="topbar-meta" id="topbar-meta">May 30 – Jun 10</div>
  </header>

  <main>
    <section class="screen active" id="screen-today" data-screen="today"></section>
    <section class="screen" id="screen-days" data-screen="days"></section>
    <section class="screen" id="screen-stays" data-screen="stays"></section>
    <section class="screen" id="screen-logistics" data-screen="logistics"></section>
    <section class="screen" id="screen-eats" data-screen="eats"></section>
  </main>

  <nav class="nav" id="nav">
    <button class="nav-btn active" data-target="today"><span class="nav-icon">🏖️</span><span>Today</span></button>
    <button class="nav-btn" data-target="days"><span class="nav-icon">🗓️</span><span>Days</span></button>
    <button class="nav-btn" data-target="stays"><span class="nav-icon">🛏️</span><span>Stays</span></button>
    <button class="nav-btn" data-target="logistics"><span class="nav-icon">✈️</span><span>Logistics</span></button>
    <button class="nav-btn" data-target="eats"><span class="nav-icon">🍛</span><span>Eats</span></button>
  </nav>
</div>

<div class="toast" id="toast">Copied</div>

<script>
/* ---------------------------------------------------------------
   TRIP DATA
--------------------------------------------------------------- */
const PHOTO = (filename) => `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(filename)}?width=400`;

const TRIP = {
  meta: {
    families: "Patel × Panchal",
    start: "2026-05-30",
    end: "2026-06-10",
    totalDays: 12
  },
  flights: [
    { who:"Panchal Family", type:"Arrival", conf:"GF4DYQ", date:"May 26, 10:53 AM", route:"SFO", carrier:"Delta" },
    { who:"Patel Family", type:"Arrival", conf:"GERBYK", date:"May 30, 10:27 PM", route:"SFO", carrier:"Delta" },
    { who:"Both Families", type:"Departure", conf:"GERBYK", date:"Jun 10, 9:55 AM", route:"SFO → SLC → DFW", carrier:"Delta · DL0920 + DL2811" }
  ],
  car: {
    company:"Alamo Rent-A-Car",

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const esc = (str) => String(str ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mapsLink = (addr) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}`;

function badgeHTML(b){
  if(!b) return "";
  const labels = {must:"MUST SEE", skip:"OK TO SKIP", gem:"HIDDEN GEM", opt:"OPTIONAL", kid:"KID FRIENDLY"};
  return `<span class="badge ${esc(b)}">${labels[b] || ""}</span>`;
}

function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function diffDays(fromISO, toISO){
  const a = new Date(fromISO+"T00:00:00");
  const b = new Date(toISO+"T00:00:00");
  return Math.round((b-a) / 86400000);
}

function copyText(text){
  const showToast = () => {
    const t = $("#toast");
    t.classList.add("show");
    clearTimeout(window.__toastT);
    window.__toastT = setTimeout(()=>t.classList.remove("show"), 1600);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(showToast);
  } else {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    showToast();
  }
}

function addrRowHTML(addr){
  if(!addr) return "";
  return `
    <div class="activity-row">
      <div class="activity-row-icon">📍</div>
      <div class="activity-row-content">
        <div>${esc(addr)}</div>
        <div class="addr-actions">
          <button class="addr-btn copy-btn" data-copy="${esc(addr)}">📋 Copy</button>
          <a class="addr-btn" target="_blank" rel="noopener" href="${mapsLink(addr)}">🗺 Maps</a>
        </div>
      </div>
    </div>`;
}

        <div class="activity-photo type-${esc(a.type || 'activity')} ${photoSrc ? '' : 'fallback'}" data-initials="${esc(a.initials || '?')}">

        </div>

          <div class="activity-meta">

            ${a.drive ? `<span>🧭 ${esc(a.drive)}</span>` : ""}

        <div class="activity-row">
          <div class="activity-row-icon">🅿</div>
          <div class="activity-row-content">

            <div>${esc(a.parking)}</div>
          </div>
        </div>` : ""}
      ${a.tickets ? `
        <div class="activity-row">

            <div class="today-day-num">D${td.n}</div>
            <div class="today-day-meta">${esc(td.dateLabel)}</div>
          </div>
          <div class="today-theme">${esc(td.theme)}</div>
          ${next ? `
            <div class="today-row">
              <div class="today-row-label">Next Up</div>
              <div class="today-row-val">${esc(next.time)} · ${esc(next.name)}</div>
            </div>` : ""}
          ${stay ? `
            <div class="today-row">
              <div class="today-row-label">Tonight</div>
              <div class="today-row-val">${esc(stay.name)}</div>
            </div>` : ""}
        </div>
        <button class="quick-btn" data-go="days" data-day="${td.n}">→ Today's Full Itinerary</button>
      `;
    } else {
      html += `
        <div class="hero">
          <div class="hero-eyebrow">Trip in progress</div>
          <div class="hero-title">Enjoy the road</div>
          <div class="hero-sub">Tap Days to see the full itinerary.</div>
        </div>
        <button class="quick-btn" data-go="days">🗓️ Open Itinerary →</button>
      `;
    }
  }

  root.innerHTML = html;

  // wire checklist
  $$(".check-item", root).forEach(el => {
    const i = el.dataset.i;
    const stored = localStorage.getItem("ca-check-"+i) === "1";
    if(stored) el.classList.add("done");
    el.addEventListener("click", () => {
      el.classList.toggle("done");
      localStorage.setItem("ca-check-"+i, el.classList.contains("done") ? "1" : "0");
    });
  });

  // wire quick navigation buttons
  $$("[data-go]", root).forEach(el => {
    el.addEventListener("click", () => {
      const target = el.dataset.go;
      const dayIdx = el.dataset.day ? parseInt(el.dataset.day,10) - 1 : null;
      switchScreen(target);
      if(target === "days" && dayIdx != null) scrollToDay(dayIdx);
    });
  });
}

function findNextActivity(day){
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  for(const a of day.activities){
    const t = parseTime(a.time);
    if(t != null && t >= nowMin) return a;
  }
  return day.activities[0];
}

function parseTime(s){
  if(!s) return null;
  const m = String(s).match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  if(!m) return null;
  let h = parseInt(m[1],10);
  const min = parseInt(m[2],10);
  const ap = (m[3] || "").toUpperCase();
  if(ap === "PM" && h !== 12) h += 12;
  if(ap === "AM" && h === 12) h = 0;
  return h*60 + min;
}

function formatDateLong(iso){
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("en-US", { weekday:"long", month:"short", day:"numeric" });
}

function renderDays(){
  const root = $("#screen-days");
  const today = todayISO();
  const pillsHTML = TRIP.days.map(d =>
    `<button class="day-pill${d.dateISO === today ? ' today' : ''}" data-day="${d.n - 1}">D${d.n}</button>`
  ).join("");

  const slidesHTML = TRIP.days.map(d => {
    const stay = stayLookup(d.stayId);
    const eats = TRIP.eats.filter(e => e.day === d.n);
    return `
      <div class="day-slide" data-day="${d.n - 1}">
        <div class="day-header">
          <div class="day-num">D${d.n}</div>
          <div class="day-date">${esc(d.dateLabel)}</div>
        </div>
        <div class="day-theme">${esc(d.theme)}</div>
        <div class="day-stats">
          <div class="stat"><span class="stat-icon">🕗</span><div><span class="stat-label">Depart</span><span class="stat-val">${esc(d.depart)}</span></div></div>
          <div class="stat"><span class="stat-icon">🚗</span><div><span class="stat-label">Drive</span><span class="stat-val">${esc(d.driving)}</span></div></div>
        </div>
        ${d.warn ? `<div class="warn">${esc(d.warn)}</div>` : ""}
        ${d.activities.map(activityHTML).join("")}
        ${d.kids ? `<div class="info-block"><strong>Kid Logistics</strong>${esc(d.kids)}</div>` : ""}
        <div class="day-summary">
          ${stay ? `<div class="day-summary-card"><div class="day-summary-label">🛏️ Tonight</div><div class="day-summary-val">${esc(stay.name)}</div></div>` : ""}
          ${eats.length ? `<div class="day-summary-card"><div class="day-summary-label">🍛 Eats</div><div class="day-summary-val">${eats.map(e=>esc(e.name)).join(" · ")}</div></div>` : ""}
        </div>
      </div>
    `;
  }).join("");

  root.innerHTML = `
    <div class="day-pills"><div class="day-pills-scroll">${pillsHTML}</div></div>
    <div class="days-carousel" id="days-carousel">${slidesHTML}</div>
  `;

  const carousel = $("#days-carousel", root);
  const pills = $$(".day-pill", root);

  pills.forEach(p => p.addEventListener("click", () => {
    scrollToDay(parseInt(p.dataset.day, 10));
  }));

  let scrollT;
  carousel.addEventListener("scroll", () => {
    clearTimeout(scrollT);
    scrollT = setTimeout(() => {
      const idx = Math.round(carousel.scrollLeft / carousel.clientWidth);
      pills.forEach((p,i) => p.classList.toggle("active", i === idx));
      const activePill = pills[idx];
      if(activePill) activePill.scrollIntoView({ inline:"center", behavior:"smooth", block:"nearest" });
    }, 80);
  });

  // Initial active pill: today if in trip, else day 1
  const todayIdx = TRIP.days.findIndex(d => d.dateISO === today);
  const initial = todayIdx >= 0 ? todayIdx : 0;
  requestAnimationFrame(() => scrollToDay(initial, false));
}

function scrollToDay(idx, smooth=true){
  const carousel = $("#days-carousel");
  if(!carousel) return;
  carousel.scrollTo({ left: idx * carousel.clientWidth, behavior: smooth ? "smooth" : "auto" });
  $$(".day-pill", $("#screen-days")).forEach((p,i) => p.classList.toggle("active", i === idx));
}

/* ---------------------------------------------------------------
   EATS
--------------------------------------------------------------- */
let eatsFilter = "all";

function renderEats(){
  const root = $("#screen-eats");
  root.innerHTML = `
    <h2 class="section-title">Eats</h2>
    <div class="eats-search-wrap">
      <input class="eats-search" id="eats-search" type="search" placeholder="Search restaurants, cities, day…" autocomplete="off">
      <div class="eats-chips">
        <button class="eats-chip active" data-filter="all">All</button>
        <button class="eats-chip" data-filter="indian">Indian</button>
        <button class="eats-chip" data-filter="veg">Veg-friendly</button>
        <button class="eats-chip" data-filter="gem">Hidden Gem</button>
      </div>
    </div>
    <div id="eats-list"></div>
  `;

  const input = $("#eats-search", root);
  const list = $("#eats-list", root);
  const chips = $$(".eats-chip", root);

  const update = () => {
    const q = (input.value || "").toLowerCase().trim();
    const filtered = TRIP.eats.filter(e => {
      if(eatsFilter === "indian" && !e.indian) return false;
      if(eatsFilter === "veg" && !e.veg) return false;
      if(eatsFilter === "gem" && !e.gem) return false;
      if(!q) return true;
      const hay = [e.name, e.area, e.cuisine, e.notes, "day "+e.day, "d"+e.day, e.addr].join(" ").toLowerCase();
      return hay.includes(q);
    });
    if(!filtered.length){
      list.innerHTML = `<div class="eats-empty">No restaurants match. Try clearing filters or search.</div>`;
      return;
    }
    list.innerHTML = filtered.map(e => `
      <article class="eat-card">
        <div class="eat-head">
          <div class="eat-name">${e.star ? "⭐ " : ""}${esc(e.name)}</div>
          <div class="eat-rating">${esc(e.rating)}⭐</div>
        </div>
        <div class="eat-meta">
          <span class="eat-tag">Day ${e.day} · ${esc(e.area)}</span>
          <span class="eat-cuisine">${esc(e.cuisine)}</span>
          ${e.reviews && e.reviews !== "—" ? `<span>${esc(e.reviews)} reviews</span>` : ""}
        </div>
        ${e.notes ? `<div class="eat-notes">${esc(e.notes)}</div>` : ""}
        <div class="eat-addr">${esc(e.addr)}</div>
        <div class="addr-actions" style="margin-top:8px">
          <button class="addr-btn copy-btn" data-copy="${esc(e.addr)}">📋 Copy</button>
          <a class="addr-btn" target="_blank" rel="noopener" href="${mapsLink(e.addr)}">🗺 Maps</a>
        </div>
      </article>
    `).join("");
  };

  input.addEventListener("input", update);
  chips.forEach(c => c.addEventListener("click", () => {
    chips.forEach(x => x.classList.remove("active"));
    c.classList.add("active");
    eatsFilter = c.dataset.filter;
    update();
  }));

  update();
}

/* ---------------------------------------------------------------
   NAVIGATION
--------------------------------------------------------------- */
function switchScreen(target){
  $$(".screen").forEach(s => s.classList.toggle("active", s.dataset.screen === target));
  $$(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.target === target));
  window.scrollTo({ top:0, behavior:"smooth" });
}

/* ---------------------------------------------------------------
   GLOBAL EVENT WIRING
--------------------------------------------------------------- */
document.addEventListener("click", (e) => {
  const copyBtn = e.target.closest(".copy-btn");
  if(copyBtn){
    const text = copyBtn.dataset.copy;
    if(text) copyText(text);
    return;
  }
  const navBtn = e.target.closest(".nav-btn");
  if(navBtn){
    switchScreen(navBtn.dataset.target);
  }
});

/* ---------------------------------------------------------------
   INIT
--------------------------------------------------------------- */
renderToday();
renderDays();
renderStays();
renderLogistics();
renderEats();

window.addEventListener("resize", () => {
  // Re-align active day on resize
  const carousel = $("#days-carousel");
  if(carousel){
    const pills = $$(".day-pill");
    const activeIdx = pills.findIndex(p => p.classList.contains("active"));
    if(activeIdx >= 0) carousel.scrollTo({ left: activeIdx * carousel.clientWidth });
  }
});
</script>
