<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CA Roadtrip">
<meta name="theme-color" content="#0F172A">
<title>California Roadtrip · Patel × Panchal · May 30 – Jun 10, 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF7ED;
    --paper:#FFFFFF;
    --sunken:#FDF4F0;
    --ink:#0F172A;
    --ink-soft:#334155;
    --ink-mute:#64748B;
    --line:#F1E6D9;
    --line-strong:#E5D5C2;
    --primary:#EA580C;
    --primary-deep:#C2410C;
    --primary-soft:#FFEDD5;
    --teal:#0E7490;
    --teal-soft:#CFFAFE;
    --accent:#B45309;
    --gem:#B45309;
    --gem-bg:#FEF3C7;
    --kid:#15803D;
    --kid-bg:#DCFCE7;
    --opt:#7C3AED;
    --opt-bg:#EDE9FE;
    --skip:#94A3B8;
    --skip-bg:#F1F5F9;
    --restroom:#0E7490;
    --restroom-bg:#CFFAFE;
    --danger:#B91C1C;
    --warn-bg:#FEF3C7;
    --warn-fg:#854D0E;
    --warn-border:#FDE68A;
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
    --radius-sm:8px;
    --radius:12px;
    --radius-lg:16px;
    --radius-xl:20px;
    --shadow-card:0 1px 2px rgba(15,23,42,0.04), 0 4px 12px rgba(15,23,42,0.04);
    --shadow-lift:0 4px 16px rgba(15,23,42,0.08), 0 12px 32px rgba(15,23,42,0.06);
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important}
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{min-height:100dvh;overflow-x:hidden}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;padding-bottom:calc(80px + var(--safe-bottom));background:var(--bg)}
  h1,h2,h3,h4,.display{font-family:'Playfair Display','Georgia',serif;font-weight:600;letter-spacing:-0.015em;color:var(--ink);line-height:1.18}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation}
  img{max-width:100%;display:block}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}

  /* ---------- ICON SYSTEM ---------- */
  .icon{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
  .icon-sm{width:16px;height:16px;stroke-width:2}
  .icon-lg{width:24px;height:24px}
  .icon-xl{width:32px;height:32px;stroke-width:1.5}

  /* ---------- TOP BAR ---------- */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(255,247,237,0.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(10px + var(--safe-top)) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0}
  .brand-title{font-family:'Playfair Display',serif;font-weight:600;font-size:17px;letter-spacing:-0.01em}
  .brand-sub{font-size:11px;color:var(--ink-mute);letter-spacing:0.06em;text-transform:uppercase;font-weight:500}
  .icon-btn{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);background:transparent;transition:background .15s ease,transform .12s ease}
  .icon-btn:hover{background:var(--sunken)}
  .icon-btn:active{background:var(--line);transform:scale(0.96)}
  .icon-btn[aria-label]{position:relative}

  /* ---------- SCREENS ---------- */
  .screen{display:none;padding:20px 16px 28px;animation:fadeUp .22s ease}
  .screen.active{display:block}
  @keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .section-eyebrow{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-mute);font-weight:600;margin-bottom:6px}
  .section-title{font-family:'Playfair Display',serif;font-weight:600;font-size:28px;line-height:1.1;margin-bottom:6px;letter-spacing:-0.02em}
  .section-sub{font-size:14px;color:var(--ink-mute);margin-bottom:18px;line-height:1.5}

  /* ---------- TODAY HERO ---------- */
  .hero{background:linear-gradient(155deg,#1E293B 0%,#0F172A 60%,#0B1220 100%);color:#fff;border-radius:var(--radius-xl);padding:24px;position:relative;overflow:hidden;box-shadow:var(--shadow-lift)}
  .hero::before{content:"";position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,var(--primary) 0%,transparent 70%);opacity:0.4}
  .hero::after{content:"";position:absolute;bottom:-40px;left:-40px;width:140px;height:140px;background:radial-gradient(circle,var(--teal) 0%,transparent 70%);opacity:0.18}
  .hero-eyebrow{position:relative;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;opacity:.85;font-weight:600;margin-bottom:8px}
  .hero-title{position:relative;font-family:'Playfair Display',serif;font-size:36px;line-height:1.05;color:#fff;font-weight:600;letter-spacing:-0.02em}
  .hero-sub{position:relative;font-size:14px;opacity:.78;margin-top:10px;line-height:1.55}
  .countdown{position:relative;display:flex;align-items:baseline;gap:14px;margin-top:22px}
  .countdown-num{font-family:'Playfair Display',serif;font-size:80px;font-weight:700;line-height:1;color:#fff;letter-spacing:-0.04em;font-variant-numeric:tabular-nums}
  .countdown-label{font-size:13px;letter-spacing:0.06em;opacity:.85;line-height:1.4}
  .countdown-label strong{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.14em;color:var(--primary);opacity:1;font-weight:700;margin-bottom:2px}

  .today-banner{background:var(--paper);border-radius:var(--radius-xl);padding:20px;margin-top:16px;border:1px solid var(--line);box-shadow:var(--shadow-card)}
  .today-meta{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .today-day-tag{display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary-deep);padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase}
  .today-date-pill{font-size:12px;color:var(--ink-mute);font-weight:500}
  .today-theme{font-family:'Playfair Display',serif;font-size:24px;margin-top:8px;letter-spacing:-0.015em;line-height:1.2}
  .today-grid{display:grid;grid-template-columns:1fr;gap:0;margin-top:14px;border-top:1px solid var(--line)}
  .today-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .today-row:last-child{border-bottom:none}
  .today-row-label{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-mute);font-weight:700}
  .today-row-val{font-size:14px;font-weight:500;text-align:right;line-height:1.4;color:var(--ink)}

  /* ---------- BUTTONS ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:var(--radius);font-weight:600;font-size:15px;transition:transform .12s ease,background .15s ease,box-shadow .15s ease;min-height:48px}
  .btn-primary{background:var(--ink);color:#fff;box-shadow:0 4px 14px rgba(15,23,42,0.18);width:100%;margin-top:14px}
  .btn-primary:hover{background:#1E293B}
  .btn-primary:active{transform:scale(0.98)}
  .btn-ghost{background:var(--sunken);color:var(--ink);border:1px solid var(--line);padding:10px 14px;font-size:13px;min-height:40px}
  .btn-ghost:hover{background:var(--line)}
  .btn-link{color:var(--teal);font-weight:600}

  /* ---------- CHECKLIST ---------- */
  .checklist{background:var(--paper);border-radius:var(--radius-xl);padding:16px 4px;margin-top:16px;border:1px solid var(--line);box-shadow:var(--shadow-card)}
  .checklist-head{display:flex;align-items:center;gap:10px;padding:0 16px 12px;border-bottom:1px solid var(--line)}
  .checklist-head h3{font-family:'Playfair Display',serif;font-size:18px;font-weight:600}
  .checklist-count{margin-left:auto;font-size:11px;color:var(--ink-mute);font-weight:600;letter-spacing:0.06em}
  .check-item{display:flex;gap:12px;padding:14px 16px;border-top:1px solid var(--line);align-items:flex-start;cursor:pointer;transition:background .12s ease;min-height:48px}
  .check-item:first-of-type{border-top:none}
  .check-item:hover{background:var(--sunken)}
  .check-item:active{background:var(--line)}
  .check-box{flex:0 0 22px;width:22px;height:22px;border-radius:7px;border:2px solid var(--line-strong);display:flex;align-items:center;justify-content:center;color:#fff;transition:all .18s ease;background:transparent;margin-top:1px}
  .check-box .icon{width:14px;height:14px;stroke-width:3;opacity:0;transform:scale(0.6)}
  .check-item.done .check-box{background:var(--kid);border-color:var(--kid)}
  .check-item.done .check-box .icon{opacity:1;transform:scale(1)}
  .check-item.done .check-text{color:var(--ink-mute);text-decoration:line-through;text-decoration-color:var(--line-strong)}
  .check-text{font-size:14px;line-height:1.5;color:var(--ink)}

  /* ---------- DAY TABS / VIEW TOGGLE ---------- */
  .days-toolbar{position:sticky;top:calc(56px + var(--safe-top));z-index:40;background:var(--bg);padding-bottom:8px;margin:0 -16px 8px;padding-left:16px;padding-right:16px;padding-top:6px}
  .view-toggle{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:10px}
  .view-toggle button{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink-mute);transition:all .18s ease}
  .view-toggle button.active{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,0.04),0 2px 6px rgba(0,0,0,0.04)}
  .view-toggle .icon{width:15px;height:15px;stroke-width:2}

  .day-pills-scroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
  .day-pills-scroll::-webkit-scrollbar{display:none}
  .day-pill{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:transparent;font-size:13px;font-weight:600;letter-spacing:0.02em;color:var(--ink-soft);white-space:nowrap;border:1px solid var(--line);transition:all .15s ease;display:inline-flex;align-items:center;gap:6px;min-height:36px}
  .day-pill:hover{background:var(--sunken)}
  .day-pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .day-pill.today-marker::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--primary)}
  .day-pill.active.today-marker::before{background:#FBBF24}

  /* ---------- DAY CONTENT ---------- */
  .day-header{margin-bottom:12px}
  .day-num-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .day-num-chip{display:inline-flex;align-items:center;gap:4px;background:var(--primary);color:#fff;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase}
  .day-date{font-size:12px;color:var(--ink-mute);font-weight:600;letter-spacing:0.04em;text-transform:uppercase}
  .day-theme{font-family:'Playfair Display',serif;font-size:28px;letter-spacing:-0.02em;line-height:1.1;margin-bottom:12px}

  .day-stats{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;font-size:12px;display:flex;gap:8px;align-items:center;flex:1;min-width:0}
  .stat .icon{color:var(--ink-mute)}
  .stat-text{min-width:0}
  .stat-label{color:var(--ink-mute);font-size:10px;text-transform:uppercase;letter-spacing:0.08em;display:block;font-weight:700;line-height:1.2}
  .stat-val{font-weight:600;font-size:13px;display:block;color:var(--ink);line-height:1.3;margin-top:1px}

  .warn{display:flex;gap:10px;background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.5;color:var(--warn-fg)}
  .warn .icon{color:var(--warn-fg);flex-shrink:0;margin-top:1px}
  .route-map-btn{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--teal),#0891B2);color:#fff;border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;font-size:13px;text-decoration:none;box-shadow:0 2px 8px rgba(14,116,144,0.25);transition:transform .12s ease,box-shadow .15s ease}
  .route-map-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(14,116,144,0.32)}
  .route-map-btn:active{transform:scale(0.99)}
  .route-map-btn .icon{color:#fff;flex-shrink:0}
  .route-map-text{flex:1;min-width:0;display:flex;flex-direction:column}
  .route-map-label{font-weight:700;font-size:13px;letter-spacing:0.01em;line-height:1.2}
  .route-map-sub{font-size:11px;opacity:0.88;margin-top:2px;line-height:1.3}

  /* ---------- ACTIVITY CARD ---------- */
  .activity{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-card)}
  .activity-main{display:flex;gap:14px;padding:14px}
  .activity-photo{flex:0 0 96px;width:96px;height:96px;border-radius:var(--radius);overflow:hidden;position:relative;background:var(--sunken)}
  .activity-photo img{width:100%;height:100%;object-fit:cover;border-radius:var(--radius)}
  .activity-photo.fallback img{display:none}
  .activity-photo.fallback{display:flex;align-items:center;justify-content:center}
  .activity-photo.fallback .icon{color:#fff;width:36px;height:36px;stroke-width:1.5}
  .activity-photo.type-activity.fallback{background:linear-gradient(135deg,var(--primary),var(--accent))}
  .activity-photo.type-hike.fallback{background:linear-gradient(135deg,#3F634D,#1F3D2A)}
  .activity-photo.type-food.fallback{background:linear-gradient(135deg,var(--accent),#92400E)}
  .activity-photo.type-stay.fallback{background:linear-gradient(135deg,#7C3AED,#4C1D95)}
  .activity-photo.type-drive.fallback{background:linear-gradient(135deg,#475569,#1E293B)}
  .activity-photo.type-flight.fallback{background:linear-gradient(135deg,var(--teal),#164E63)}
  .activity-photo.type-car.fallback{background:linear-gradient(135deg,#475569,#0F172A)}
  .activity-photo.type-beach.fallback{background:linear-gradient(135deg,#0891B2,#0E7490)}

  .activity-body{flex:1;min-width:0;display:flex;flex-direction:column}
  .activity-time-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
  .activity-time{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink);background:var(--sunken);padding:3px 8px;border-radius:6px;font-variant-numeric:tabular-nums;letter-spacing:0.01em}
  .activity-time .icon{width:13px;height:13px;color:var(--ink-soft)}
  .activity-name{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;line-height:1.18;color:var(--ink);letter-spacing:-0.01em;margin-top:2px}
  .activity-desc{font-size:13px;color:var(--ink-soft);line-height:1.5;margin-top:6px}
  .activity-meta{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-mute)}
  .activity-meta span{display:inline-flex;align-items:center;gap:4px}
  .activity-meta .icon{width:13px;height:13px}

  /* ---------- BADGES (the eye-catchers) ---------- */
  .badges-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:0}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;line-height:1;white-space:nowrap}
  .badge .icon{width:12px;height:12px;stroke-width:2.5}
  .badge.must{background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(234,88,12,0.3)}
  .badge.gem{background:var(--gem);color:#fff;box-shadow:0 1px 2px rgba(180,83,9,0.3)}
  .badge.opt{background:var(--opt);color:#fff;box-shadow:0 1px 2px rgba(124,58,237,0.3)}
  .badge.kid{background:var(--kid);color:#fff;box-shadow:0 1px 2px rgba(21,128,61,0.3)}
  .badge.skip{background:var(--skip-bg);color:var(--ink-mute);border:1px dashed var(--line-strong);font-weight:600}
  .badge.restroom{background:var(--restroom-bg);color:var(--restroom);border:1px solid #A5F3FC}

  /* ---------- DETAIL ROWS ---------- */
  .detail-rows{border-top:1px solid var(--line);background:#FFFCF8}
  .detail-row{padding:11px 14px;font-size:13px;line-height:1.5;display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line)}
  .detail-row:first-of-type{border-top:none}
  .detail-icon{flex:0 0 20px;color:var(--ink-mute);margin-top:1px}
  .detail-content{flex:1;min-width:0}
  .detail-label{font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-mute);font-weight:700;margin-bottom:2px}
  .addr-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .addr-btn{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;background:var(--paper);border:1px solid var(--line-strong);border-radius:8px;font-size:12px;font-weight:600;color:var(--ink);transition:all .15s ease;min-height:36px}
  .addr-btn:hover{background:var(--sunken);border-color:var(--ink-mute)}
  .addr-btn:active{transform:scale(0.97)}
  .addr-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .addr-btn.primary:hover{background:#1E293B}
  .addr-btn .icon{width:13px;height:13px;stroke-width:2.2}

  /* ---------- INFO BLOCK (kid logistics) ---------- */
  .info-block{display:flex;gap:10px;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--kid);padding:12px 14px;border-radius:var(--radius);margin:14px 0;font-size:13px;line-height:1.55}
  .info-block .icon{color:var(--kid);flex-shrink:0;margin-top:1px}
  .info-block strong{color:var(--kid);font-weight:700;display:block;margin-bottom:3px;font-size:11px;letter-spacing:0.1em;text-transform:uppercase}

  /* ---------- DAY SUMMARY ---------- */
  .day-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .day-summary-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px;font-size:12.5px}
  .day-summary-label{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-mute);font-weight:700;margin-bottom:6px}
  .day-summary-label .icon{width:13px;height:13px;color:var(--ink-mute)}
  .day-summary-val{font-family:'Playfair Display',serif;font-size:14.5px;line-height:1.35;font-weight:500;color:var(--ink)}

  /* ---------- TIMELINE VIEW ---------- */
  .timeline{position:relative;padding:6px 0 4px;margin-top:4px}
  .timeline::before{content:"";position:absolute;left:65px;top:8px;bottom:8px;width:2px;background:var(--line-strong);border-radius:1px}
  .tl-row{display:flex;gap:14px;padding:0 0 10px;align-items:flex-start;position:relative}
  .tl-time{flex:0 0 56px;font-size:11.5px;font-weight:700;color:var(--ink);text-align:right;padding-top:14px;font-variant-numeric:tabular-nums;letter-spacing:-0.01em;line-height:1.2}
  .tl-time small{display:block;font-size:9.5px;color:var(--ink-mute);font-weight:600;letter-spacing:0.04em;margin-top:1px}
  .tl-dot{flex:0 0 24px;width:24px;display:flex;justify-content:center;padding-top:14px;position:relative;z-index:1}
  .tl-dot-inner{width:14px;height:14px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink-mute);transition:all .2s ease}
  .tl-row[data-badge="must"] .tl-dot-inner{border-color:var(--primary);background:var(--primary)}
  .tl-row[data-badge="gem"] .tl-dot-inner{border-color:var(--gem);background:var(--gem)}
  .tl-row[data-badge="opt"] .tl-dot-inner{border-color:var(--opt);background:var(--paper)}
  .tl-row[data-badge="kid"] .tl-dot-inner{border-color:var(--kid);background:var(--kid)}
  .tl-row[data-badge="skip"] .tl-dot-inner{border-color:var(--skip);background:var(--paper)}
  .tl-card{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px;cursor:pointer;transition:all .15s ease;box-shadow:var(--shadow-card)}
  .tl-card:hover{border-color:var(--ink-mute);transform:translateY(-1px);box-shadow:var(--shadow-lift)}
  .tl-card:active{transform:translateY(0);background:var(--sunken)}
  .tl-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .tl-name{font-family:'Playfair Display',serif;font-size:15.5px;font-weight:600;letter-spacing:-0.01em;line-height:1.25;color:var(--ink);margin-bottom:2px}
  .tl-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
  .tl-meta-item{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--ink-mute);font-weight:500}
  .tl-meta-item .icon{width:12px;height:12px}
  .tl-expand{font-size:11px;color:var(--teal);font-weight:600;margin-top:6px;display:inline-flex;align-items:center;gap:3px}
  .tl-expand .icon{width:12px;height:12px;transition:transform .2s ease}
  .tl-details{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-strong);font-size:13px;line-height:1.55;color:var(--ink-soft)}
  .tl-card.open .tl-details{display:block;animation:fadeUp .22s ease}
  .tl-card.open .tl-expand .icon{transform:rotate(180deg)}

  /* ---------- STAYS ---------- */
  .stay{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px;display:flex;gap:14px;box-shadow:var(--shadow-card)}
  .stay-mark{flex:0 0 56px;width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#7C3AED,#5B21B6);color:#fff;display:flex;align-items:center;justify-content:center}
  .stay-mark .icon{width:26px;height:26px;stroke-width:1.5}
  .stay.type-airbnb .stay-mark{background:linear-gradient(135deg,var(--primary),var(--primary-deep))}
  .stay-info{flex:1;min-width:0}
  .stay-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px;flex-wrap:wrap}
  .stay-name{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;line-height:1.2;letter-spacing:-0.01em}
  .stay-nights{font-size:11px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:0.08em;font-weight:700;flex-shrink:0;background:var(--sunken);padding:3px 8px;border-radius:5px}
  .stay-dates{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:500}
  .stay-dates .icon{width:14px;height:14px;color:var(--ink-mute)}
  .stay-addr{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--ink-soft);line-height:1.45}
  .stay-addr .icon{flex-shrink:0;margin-top:2px;width:14px;height:14px;color:var(--ink-mute)}
  .stay-conf{display:inline-flex;align-items:center;gap:5px;font-size:11px;letter-spacing:0.04em;background:var(--sunken);color:var(--ink-soft);padding:4px 8px;border-radius:6px;margin-top:8px;font-weight:600;font-family:ui-monospace,'SF Mono',Menlo,monospace}
  .stay-conf .icon{width:12px;height:12px}

  /* ---------- LOGISTICS ---------- */
  .logistics-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-card)}
  .logistics-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .logistics-icon{width:44px;height:44px;border-radius:12px;background:var(--sunken);display:flex;align-items:center;justify-content:center;color:var(--ink)}
  .logistics-icon .icon{width:22px;height:22px;stroke-width:1.75}
  .logistics-title{font-family:'Playfair Display',serif;font-size:19px;font-weight:600;letter-spacing:-0.01em;line-height:1.2}
  .logistics-sub{font-size:12px;color:var(--ink-mute);margin-top:1px}
  .flight-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
  .flight-row:first-of-type{border-top:none;padding-top:0}
  .flight-who{font-weight:600}
  .flight-meta{font-size:12px;color:var(--ink-mute);margin-top:3px;line-height:1.45}
  .flight-conf{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;background:var(--sunken);padding:4px 8px;border-radius:6px;letter-spacing:0.04em;font-weight:600;color:var(--ink-soft);white-space:nowrap}
  .car-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .car-cell{background:var(--sunken);border-radius:var(--radius);padding:12px;font-size:12px}
  .car-cell-label{font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-mute);font-weight:700;margin-bottom:5px}
  .car-cell-val{font-weight:600;font-size:13.5px;line-height:1.35;color:var(--ink)}
  .car-note{display:flex;align-items:flex-start;gap:6px;margin-top:10px;font-size:12px;color:var(--ink-mute);background:var(--sunken);padding:8px 10px;border-radius:8px;line-height:1.4}
  .car-note .icon{color:var(--ink-mute);flex-shrink:0;margin-top:1px}

  /* ---------- EATS ---------- */
  .search-wrap{position:sticky;top:calc(56px + var(--safe-top));z-index:40;background:var(--bg);padding:8px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px}
  .search-input-wrap{position:relative;display:flex;align-items:center}
  .search-input-wrap .icon{position:absolute;left:14px;color:var(--ink-mute);pointer-events:none}
  .search-input{width:100%;padding:13px 14px 13px 42px;border-radius:var(--radius);border:1px solid var(--line-strong);background:var(--paper);font-size:15px;font-family:inherit;color:var(--ink);transition:all .15s ease;min-height:48px}
  .search-input::placeholder{color:var(--ink-mute)}
  .search-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .search-clear{position:absolute;right:6px;width:36px;height:36px;border-radius:50%;color:var(--ink-mute);display:none}
  .search-clear.visible{display:flex;align-items:center;justify-content:center}
  .search-clear:hover{background:var(--sunken)}

  .filter-chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
  .filter-chips::-webkit-scrollbar{display:none}
  .filter-chip{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:transparent;font-size:12.5px;font-weight:600;color:var(--ink-soft);border:1px solid var(--line-strong);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;min-height:32px;transition:all .15s ease}
  .filter-chip:hover{background:var(--sunken)}
  .filter-chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  .eat-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;margin-bottom:10px;box-shadow:var(--shadow-card)}
  .eat-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
  .eat-name{display:flex;align-items:center;gap:6px;font-family:'Playfair Display',serif;font-size:18px;font-weight:600;line-height:1.2;letter-spacing:-0.01em}
  .eat-name .icon{color:var(--accent);width:16px;height:16px;flex-shrink:0}
  .eat-rating{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;background:var(--ink);color:#fff;padding:4px 8px;border-radius:6px;flex-shrink:0;letter-spacing:0.01em}
  .eat-rating .icon{width:11px;height:11px;color:#FBBF24;fill:#FBBF24;stroke-width:1.5}
  .eat-meta{display:flex;gap:8px;font-size:12px;color:var(--ink-mute);margin:8px 0;flex-wrap:wrap;align-items:center}
  .eat-tag{background:var(--primary-soft);color:var(--primary-deep);padding:3px 8px;border-radius:5px;font-weight:700;font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase}
  .eat-cuisine{font-weight:600;color:var(--teal)}
  .eat-notes{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin-top:6px}
  .eat-addr{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--ink-mute);margin-top:10px;line-height:1.4}
  .eat-addr .icon{flex-shrink:0;margin-top:2px;width:13px;height:13px}
  .eats-empty{text-align:center;color:var(--ink-mute);font-size:14px;padding:48px 16px;background:var(--paper);border-radius:var(--radius-lg);border:1px dashed var(--line-strong)}
  .eats-empty .icon{margin:0 auto 10px;color:var(--ink-mute);width:32px;height:32px}

  /* ---------- BOTTOM NAV ---------- */
  .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;background:rgba(255,247,237,0.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe-bottom));z-index:60}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;color:var(--ink-mute);font-size:10.5px;font-weight:600;letter-spacing:0.02em;border-radius:12px;transition:color .15s ease;min-height:56px;justify-content:center}
  .nav-btn .icon{width:22px;height:22px;stroke-width:1.75;transition:transform .18s ease}
  .nav-btn:active .icon{transform:scale(0.92)}
  .nav-btn.active{color:var(--primary-deep)}
  .nav-btn.active .icon{stroke-width:2.25}

  /* ---------- GLOBAL SEARCH MODAL ---------- */
  .search-modal{position:fixed;inset:0;z-index:200;background:rgba(15,23,42,0.4);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;padding:calc(20px + var(--safe-top)) 12px 12px;animation:fadeIn .2s ease}
  .search-modal.open{display:flex}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .search-modal-panel{width:100%;max-width:560px;background:var(--paper);border-radius:var(--radius-xl);max-height:calc(100dvh - 80px);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lift);animation:slideUp .25s ease}
  @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .search-modal-head{padding:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .search-modal-head .search-input-wrap{flex:1}
  .search-modal-results{flex:1;overflow-y:auto;padding:8px 6px 16px}
  .search-group-head{font-size:10.5px;text-transform:uppercase;letter-spacing:0.12em;font-weight:700;color:var(--ink-mute);padding:14px 12px 6px}
  .search-result{display:flex;gap:12px;padding:11px 12px;border-radius:var(--radius);cursor:pointer;align-items:flex-start;transition:background .12s ease;min-height:48px}
  .search-result:hover{background:var(--sunken)}
  .search-result:active{background:var(--line)}
  .search-result-mark{width:36px;height:36px;border-radius:10px;background:var(--sunken);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex-shrink:0}
  .search-result-mark .icon{width:18px;height:18px}
  .search-result-body{flex:1;min-width:0}
  .search-result-title{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.3}
  .search-result-sub{font-size:12px;color:var(--ink-mute);margin-top:2px;line-height:1.35}
  .search-empty{text-align:center;color:var(--ink-mute);padding:48px 20px;font-size:14px}

  /* ---------- TOAST ---------- */
  .toast{position:fixed;bottom:calc(96px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:500;opacity:0;transition:all .22s ease;z-index:200;pointer-events:none;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow-lift)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .icon{width:15px;height:15px;color:#86EFAC}

  @media (max-width:380px){
    .activity-photo{flex:0 0 80px;width:80px;height:80px}
    .activity-name{font-size:16.5px}
    .countdown-num{font-size:64px}
    .hero-title{font-size:30px}
    .day-theme{font-size:24px}
    .section-title{font-size:24px}
    .timeline::before{left:60px}
    .tl-time{flex:0 0 50px}
  }
</style>
</head>

function localPath(filename){
  const slug = SLUG_MAP[filename];
  return slug ? `assets/photos/${slug}.jpg` : "";
}
function imgChain(filename, alt){
  if(!filename) return "";
  const local = localPath(filename);
  const wiki = PHOTO(filename);
  if(local){
    return `<img src="${esc(local)}" alt="${esc(alt)}" loading="lazy" data-fallback="${esc(wiki)}" onerror="window.imgFallback(this)">`;
  }
  return `<img src="${esc(wiki)}" alt="${esc(alt)}" loading="lazy" onerror="this.parentElement.classList.add('fallback');this.remove()">`;
}
window.imgFallback = function(img){
  const fb = img.dataset.fallback;
  if(fb && img.src.indexOf(fb) === -1){
    img.onerror = function(){
      const p = img.parentElement;
      if(p){ p.classList.add('fallback'); }
      img.remove();
    };
    img.removeAttribute('data-fallback');
    img.src = fb;
  } else {
    const p = img.parentElement;
    if(p){ p.classList.add('fallback'); }
    img.remove();
  }
};

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mapsLink = (addr) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}`;
const icon = (name, cls="icon") => `<svg class="${cls}" aria-hidden="true"><use href="#${name}"/></svg>`;

const TYPE_ICON = {
  activity:"i-map-pin", hike:"i-mountain", food:"i-utensils", stay:"i-bed",
  drive:"i-route", flight:"i-plane", car:"i-car", beach:"i-waves"
};

function badgeHTML(b){
  if(!b) return "";
  const map = {
    must: { label:"Must See", icon:"i-flame" },
    gem:  { label:"Hidden Gem", icon:"i-gem" },
    opt:  { label:"Optional", icon:"i-circle-dashed" },
    kid:  { label:"Kid Friendly", icon:"i-heart" },
    skip: { label:"OK to Skip", icon:"i-x" }
  };
  const m = map[b];
  if(!m) return "";
  return `<span class="badge ${b}">${icon(m.icon,"icon icon-sm")} ${m.label}</span>`;
}

function restroomBadgeHTML(a){
  if(a.restroom){
    return `<span class="badge restroom">${icon("i-toilet","icon icon-sm")} Restroom</span>`;
  }
  return "";
}

function todayISO(){
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0,10);
}

function diffDays(fromISO, toISO){
  const a = new Date(fromISO+"T00:00:00");
  const b = new Date(toISO+"T00:00:00");
  return Math.round((b-a) / 86400000);
}

function parseTime(s){
  if(!s) return null;
  const m = String(s).match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  if(!m) return null;
  let h = parseInt(m[1],10);
  const min = parseInt(m[2],10);
  const ap = (m[3] || "").toUpperCase();
  if(ap === "PM" && h !== 12) h += 12;
  if(ap === "AM" && h === 12) h = 0;
  return h*60 + min;
}

function timeParts(s){
  const m = String(s||"").match(/^(\d{1,2}:\d{2})\s*(AM|PM)?/i);
  if(!m) return { num:s, ap:"" };
  return { num:m[1], ap:(m[2]||"").toUpperCase() };
}

function formatDateLong(iso){
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("en-US", { weekday:"long", month:"short", day:"numeric" });
}

function showToast(msg="Copied"){
  const t = $("#toast");
  $("#toast-msg").textContent = msg;
  t.classList.add("show");
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=>t.classList.remove("show"), 1700);
}

function copyText(text, label="Copied"){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>showToast(label)).catch(()=>fallbackCopy(text,label));
  } else {
    fallbackCopy(text,label);
  }
}
function fallbackCopy(text,label){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  showToast(label);
}

function stayLookup(id){ return TRIP.stays.find(s => s.id === id); }

function renderToday(){
  const root = $("#screen-today");
  const today = todayISO();
  const startISO = TRIP.meta.start, endISO = TRIP.meta.end;
  let html = "";

  if(today < startISO){
    const days = diffDays(today, startISO);
    html += `
      <div class="hero">
        <div class="hero-eyebrow">Trip Countdown</div>
        <div class="hero-title">California,<br>here we come.</div>
        <div class="hero-sub">${esc(TRIP.meta.families)} · 12-day roadtrip across coast, sequoias, and lakes</div>
        <div class="countdown">
          <div class="countdown-num">${days}</div>
          <div class="countdown-label"><strong>${days === 1 ? "Day to go" : "Days to go"}</strong>Departing ${esc(formatDateLong(startISO))}</div>
        </div>
      </div>

      <div class="checklist">
        <div class="checklist-head">
          ${icon("i-clipboard")}
          <h3>Pre-Trip Checklist</h3>
          <span class="checklist-count" id="cl-count"></span>
        </div>
        ${TRIP.preTripChecklist.map((item, i) => `
          <button class="check-item" data-i="${i}" role="checkbox" aria-checked="false">
            <div class="check-box">${icon("i-check")}</div>
            <div class="check-text">${esc(item)}</div>
          </button>
        `).join("")}
      </div>

      <button class="btn btn-primary" data-go="days">${icon("i-calendar")} Browse the Itinerary ${icon("i-arrow-right")}</button>
    `;
  } else if(today > endISO){
    html += `
      <div class="hero">
        <div class="hero-eyebrow">Trip Complete</div>
        <div class="hero-title">Welcome home.</div>
        <div class="hero-sub">12 days, 2 families, countless memories. Tap Days to relive any moment.</div>
      </div>
      <button class="btn btn-primary" data-go="days">${icon("i-calendar")} Browse the Itinerary ${icon("i-arrow-right")}</button>
    `;
  } else {
    const td = TRIP.days.find(d => d.dateISO === today);
    if(td){
      const stay = stayLookup(td.stayId);
      const next = findNextActivity(td);
      html += `
        <div class="hero">
          <div class="hero-eyebrow">Day ${td.n} of 12 · ${esc(td.dateLabel)}</div>
          <div class="hero-title">${esc(td.theme)}</div>
          <div class="hero-sub">Depart by ${esc(td.depart)} · ${esc(td.driving)}</div>
        </div>
        <div class="today-banner">
          <div class="today-meta">
            <div class="today-day-tag">${icon("i-sun","icon icon-sm")} Day ${td.n}</div>
            <div class="today-date-pill">${esc(td.dateLabel)}</div>
          </div>
          <div class="today-theme">${esc(td.theme)}</div>
          <div class="today-grid">
            ${next ? `
              <div class="today-row">
                <span class="today-row-label">${icon("i-clock","icon icon-sm")} Next Up</span>
                <span class="today-row-val">${esc(next.time)} · ${esc(next.name)}</span>
              </div>` : ""}
            <div class="today-row">
              <span class="today-row-label">${icon("i-route","icon icon-sm")} Driving</span>
              <span class="today-row-val">${esc(td.driving)}</span>
            </div>
            ${stay ? `
              <div class="today-row">
                <span class="today-row-label">${icon("i-bed","icon icon-sm")} Tonight</span>
                <span class="today-row-val">${esc(stay.name)}</span>
              </div>` : ""}
          </div>
        </div>
        <button class="btn btn-primary" data-go="days" data-day="${td.n}">${icon("i-calendar")} See Today's Full Itinerary ${icon("i-arrow-right")}</button>
      `;
    } else {
      html += `
        <div class="hero">
          <div class="hero-eyebrow">Trip in progress</div>
          <div class="hero-title">Enjoy the road.</div>
          <div class="hero-sub">Tap Days to see the full itinerary.</div>
        </div>
        <button class="btn btn-primary" data-go="days">${icon("i-calendar")} Open Itinerary ${icon("i-arrow-right")}</button>
      `;
    }
  }

  root.innerHTML = html;

  const updateCount = () => {
    const items = $$(".check-item", root);
    const done = items.filter(el => el.classList.contains("done")).length;
    const c = $("#cl-count", root);
    if(c) c.textContent = `${done} / ${items.length} done`;
  };

  $$(".check-item", root).forEach(el => {
    const i = el.dataset.i;
    const stored = localStorage.getItem("ca-check-"+i) === "1";
    if(stored){ el.classList.add("done"); el.setAttribute("aria-checked","true"); }
    el.addEventListener("click", () => {
      const done = el.classList.toggle("done");
      el.setAttribute("aria-checked", done ? "true" : "false");
      localStorage.setItem("ca-check-"+i, done ? "1" : "0");
      updateCount();
    });
  });
  updateCount();

  $$("[data-go]", root).forEach(el => {
    el.addEventListener("click", () => {
      const target = el.dataset.go;
      const dayN = el.dataset.day ? parseInt(el.dataset.day,10) : null;
      switchScreen(target);
      if(target === "days" && dayN != null) scrollToDay(dayN - 1, false);
    });
  });
}

function findNextActivity(day){
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  for(const a of day.activities){
    const t = parseTime(a.time);
    if(t != null && t >= nowMin) return a;
  }
  return day.activities[0];
}

/* ===============================================================
   DAYS SCREEN
=============================================================== */
let daysView = "card"; // "card" | "timeline"
let activeDayIdx = 0;

function renderDays(){
  const root = $("#screen-days");
  const today = todayISO();
  const pillsHTML = TRIP.days.map((d,i) =>
    `<button class="day-pill${d.dateISO === today ? ' today-marker' : ''}" data-day="${i}">D${d.n}</button>`
  ).join("");

  root.innerHTML = `
    <div class="days-toolbar">
      <div class="view-toggle" role="tablist" aria-label="View mode">
        <button class="${daysView==='card'?'active':''}" data-view="card" role="tab" aria-selected="${daysView==='card'}">${icon("i-list")} Card</button>
        <button class="${daysView==='timeline'?'active':''}" data-view="timeline" role="tab" aria-selected="${daysView==='timeline'}">${icon("i-timeline")} Timeline</button>
      </div>
      <div class="day-pills-scroll" id="day-pills">${pillsHTML}</div>
    </div>
    <div id="day-content"></div>
  `;

  const todayIdx = TRIP.days.findIndex(d => d.dateISO === today);
  if(activeDayIdx === 0 && todayIdx >= 0) activeDayIdx = todayIdx;

  // wire view toggle
  $$(".view-toggle button", root).forEach(b => {
    b.addEventListener("click", () => {
      daysView = b.dataset.view;
      $$(".view-toggle button", root).forEach(x => {
        x.classList.toggle("active", x.dataset.view === daysView);
        x.setAttribute("aria-selected", x.dataset.view === daysView ? "true" : "false");
      });
      renderDayContent();
    });
  });

  // wire pills
  $$(".day-pill", root).forEach(p => p.addEventListener("click", () => scrollToDay(parseInt(p.dataset.day,10), true)));

  renderDayContent();
  updateActivePill();
}

function updateActivePill(){
  $$(".day-pill", $("#screen-days")).forEach((p,i) => p.classList.toggle("active", i === activeDayIdx));
  // scroll active pill into view
  const ap = $$(".day-pill", $("#screen-days"))[activeDayIdx];
  if(ap) ap.scrollIntoView({ inline:"center", block:"nearest", behavior:"smooth" });
}

function scrollToDay(idx, smooth=true){
  activeDayIdx = idx;
  renderDayContent();
  updateActivePill();
  if(smooth){
    window.scrollTo({ top:0, behavior:"smooth" });
  }
}

function renderDayContent(){
  const d = TRIP.days[activeDayIdx];
  if(!d) return;
  const root = $("#day-content");
  const stay = stayLookup(d.stayId);
  const eats = TRIP.eats.filter(e => e.day === d.n);

  const header = `
    <div class="day-header">
      <div class="day-num-row">
        <span class="day-num-chip">${icon("i-sun","icon icon-sm")} Day ${d.n}</span>
        <span class="day-date">${esc(d.dateLabel)}</span>
      </div>
      <h2 class="day-theme">${esc(d.theme)}</h2>
    </div>
    <div class="day-stats">
      <div class="stat">${icon("i-clock")}<div class="stat-text"><span class="stat-label">Depart</span><span class="stat-val">${esc(d.depart)}</span></div></div>
      <div class="stat">${icon("i-route")}<div class="stat-text"><span class="stat-label">Driving</span><span class="stat-val">${esc(d.driving)}</span></div></div>
    </div>
    ${d.routeMapUrl ? `<a class="route-map-btn" target="_blank" rel="noopener" href="${esc(d.routeMapUrl)}">${icon("i-route")}<div class="route-map-text"><span class="route-map-label">Full Route in Google Maps</span><span class="route-map-sub">All ${d.activities.filter(a=>a.addr).length} stops pinned in order</span></div>${icon("i-external")}</a>` : ""}
    ${d.warn ? `<div class="warn">${icon("i-alert")}<div>${esc(d.warn)}</div></div>` : ""}
  `;

  const body = daysView === "card"
    ? d.activities.map(activityHTML).join("")
    : timelineHTML(d);

  const footer = `
    ${d.kids ? `<div class="info-block">${icon("i-info")}<div><strong>Kid Logistics</strong>${esc(d.kids)}</div></div>` : ""}
    <div class="day-summary">
      ${stay ? `<div class="day-summary-card"><div class="day-summary-label">${icon("i-bed","icon icon-sm")} Tonight</div><div class="day-summary-val">${esc(stay.name)}</div></div>` : ""}
      ${eats.length ? `<div class="day-summary-card"><div class="day-summary-label">${icon("i-utensils","icon icon-sm")} Eats</div><div class="day-summary-val">${eats.map(e=>esc(e.name)).join(" · ")}</div></div>` : ""}
    </div>
  `;

  root.innerHTML = header + body + footer;

  // wire timeline expand
  $$(".tl-card", root).forEach(c => {
    const btn = $(".tl-expand", c);
    c.addEventListener("click", (e) => {
      // ignore if clicking on a link/button inside
      if(e.target.closest("a, button.copy-btn, .addr-btn")) return;
      const open = c.classList.toggle("open");
      if(btn) btn.setAttribute("aria-expanded", open ? "true" : "false");
    });
  });
}

/* ===============================================================
   EATS
=============================================================== */
let eatsFilter = "all";

function renderEats(){
  const root = $("#screen-eats");
  root.innerHTML = `
    <div class="section-eyebrow">Restaurants</div>
    <h2 class="section-title">Eats</h2>
    <p class="section-sub">${TRIP.eats.length} Indian and veg-friendly stops curated along the route</p>

    <div class="search-wrap">
      <div class="search-input-wrap">
        ${icon("i-search")}
        <input class="search-input" id="eats-search" type="search" placeholder="Search restaurants, cities, day…" autocomplete="off">
        <button class="search-clear" id="eats-clear" aria-label="Clear search">${icon("i-x","icon icon-sm")}</button>
      </div>
      <div class="filter-chips">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="indian">Indian</button>
        <button class="filter-chip" data-filter="veg">Veg-friendly</button>
        <button class="filter-chip" data-filter="gem">${icon("i-gem","icon icon-sm")} Hidden Gem</button>
      </div>
    </div>
    <div id="eats-list"></div>
  `;

  const input = $("#eats-search", root);
  const clearBtn = $("#eats-clear", root);
  const list = $("#eats-list", root);
  const chips = $$(".filter-chip", root);

  const update = () => {
    const q = (input.value || "").toLowerCase().trim();
    clearBtn.classList.toggle("visible", q.length > 0);
    const filtered = TRIP.eats.filter(e => {
      if(eatsFilter === "indian" && !e.indian) return false;
      if(eatsFilter === "veg" && !e.veg) return false;
      if(eatsFilter === "gem" && !e.gem) return false;
      if(!q) return true;
      const hay = [e.name, e.area, e.cuisine, e.notes, "day "+e.day, "d"+e.day, e.addr].join(" ").toLowerCase();
      return hay.includes(q);
    });
    if(!filtered.length){
      list.innerHTML = `<div class="eats-empty">${icon("i-search","icon icon-xl")}<div><strong>No restaurants match.</strong></div><div style="margin-top:4px">Try clearing filters or refining your search.</div></div>`;
      return;
    }
    list.innerHTML = filtered.map(e => `
      <article class="eat-card">
        <div class="eat-head">
          <h3 class="eat-name">${e.star ? icon("i-star") : ""}${esc(e.name)}</h3>
          <span class="eat-rating">${icon("i-star")}${esc(e.rating)}</span>
        </div>
        <div class="eat-meta">
          <span class="eat-tag">Day ${e.day} · ${esc(e.area)}</span>
          <span class="eat-cuisine">${esc(e.cuisine)}</span>
          ${e.reviews && e.reviews !== "—" ? `<span>${esc(e.reviews)} reviews</span>` : ""}
          ${e.gem ? badgeHTML("gem") : ""}
        </div>
        ${e.notes ? `<div class="eat-notes">${esc(e.notes)}</div>` : ""}
        <div class="eat-addr">${icon("i-map-pin")}<span>${esc(e.addr)}</span></div>
        <div class="addr-actions" style="margin-top:10px">
          <button class="addr-btn copy-btn" data-copy="${esc(e.addr)}">${icon("i-copy")} Copy</button>
          <a class="addr-btn primary" target="_blank" rel="noopener" href="${mapsLink(e.addr)}">${icon("i-external")} Maps</a>
        </div>
      </article>
    `).join("");
  };

  input.addEventListener("input", update);
  clearBtn.addEventListener("click", () => { input.value = ""; update(); input.focus(); });
  chips.forEach(c => c.addEventListener("click", () => {
    chips.forEach(x => x.classList.remove("active"));
    c.classList.add("active");
    eatsFilter = c.dataset.filter;
    update();
  }));

  update();
}

/* ===============================================================
   GLOBAL SEARCH
=============================================================== */
function openSearch(){
  $("#search-modal").classList.add("open");
  setTimeout(()=>$("#global-search").focus(), 50);
  renderGlobalSearchResults("");
}
function closeSearch(){ $("#search-modal").classList.remove("open"); }

function renderGlobalSearchResults(q){
  const root = $("#search-results");
  const query = q.toLowerCase().trim();

  if(!query){
    root.innerHTML = `
      <div class="search-empty">
        <div style="margin-bottom:6px;color:var(--ink-mute)">${icon("i-search","icon icon-xl")}</div>
        <div>Search across all 12 days,<br>16 restaurants, and 6 stays.</div>
      </div>
    `;
    return;
  }

  const acts = [];
  TRIP.days.forEach(d => {
    d.activities.forEach(a => {
      const hay = [a.name, a.desc, a.addr, "day "+d.n, "d"+d.n, d.theme].filter(Boolean).join(" ").toLowerCase();
      if(hay.includes(query)) acts.push({ ...a, dayN:d.n, dayLabel:d.dateLabel, dayTheme:d.theme });
    });
  });
  const eats = TRIP.eats.filter(e => {
    const hay = [e.name, e.area, e.cuisine, e.notes, e.addr, "day "+e.day].join(" ").toLowerCase();
    return hay.includes(query);
  });
  const stays = TRIP.stays.filter(s => {
    const hay = [s.name, s.addr, s.type].join(" ").toLowerCase();
    return hay.includes(query);
  });

  let html = "";
  if(acts.length){
    html += `<div class="search-group-head">Activities · ${acts.length}</div>`;
    html += acts.slice(0,12).map(a => `
      <button class="search-result" data-go="day" data-day="${a.dayN}">
        <div class="search-result-mark">${icon(TYPE_ICON[a.type]||"i-map-pin")}</div>
        <div class="search-result-body">
          <div class="search-result-title">${esc(a.name)}</div>
          <div class="search-result-sub">Day ${a.dayN} · ${esc(a.dayLabel)} · ${esc(a.time)}</div>
        </div>
        ${icon("i-chevron-right")}
      </button>
    `).join("");
  }
  if(eats.length){
    html += `<div class="search-group-head">Restaurants · ${eats.length}</div>`;
    html += eats.map(e => `
      <button class="search-result" data-go="eats">
        <div class="search-result-mark">${icon("i-utensils")}</div>
        <div class="search-result-body">
          <div class="search-result-title">${e.star?icon("i-star")+" ":""}${esc(e.name)}</div>
          <div class="search-result-sub">Day ${e.day} · ${esc(e.area)} · ${esc(e.cuisine)} · ${esc(e.rating)}⭐</div>
        </div>
        ${icon("i-chevron-right")}
      </button>
    `).join("");
  }
  if(stays.length){
    html += `<div class="search-group-head">Stays · ${stays.length}</div>`;
    html += stays.map(s => `
      <button class="search-result" data-go="stays">
        <div class="search-result-mark">${icon(s.type.toLowerCase()==="airbnb"?"i-house":"i-bed")}</div>
        <div class="search-result-body">
          <div class="search-result-title">${esc(s.name)}</div>
          <div class="search-result-sub">${esc(s.checkin)} → ${esc(s.checkout)} · ${s.nights} ${s.nights===1?"night":"nights"}</div>
        </div>
        ${icon("i-chevron-right")}
      </button>
    `).join("");
  }
  if(!html){
    html = `<div class="search-empty"><strong>No matches.</strong><br>Try a different keyword.</div>`;
  }
  root.innerHTML = html;

  $$(".search-result", root).forEach(b => {
    b.addEventListener("click", () => {
      const go = b.dataset.go;
      closeSearch();
      if(go === "day"){
        switchScreen("days");
        scrollToDay(parseInt(b.dataset.day,10) - 1, false);
      } else {
        switchScreen(go);
      }
    });
  });
}

/* ===============================================================
   NAVIGATION
=============================================================== */
function switchScreen(target){
  $$(".screen").forEach(s => s.classList.toggle("active", s.dataset.screen === target));
  $$(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.target === target));
  window.scrollTo({ top:0, behavior:"smooth" });
}

/* ===============================================================
   EVENT WIRING
=============================================================== */
document.addEventListener("click", (e) => {
  const copyBtn = e.target.closest(".copy-btn");
  if(copyBtn){
    const text = copyBtn.dataset.copy;
    const label = copyBtn.dataset.label || "Address copied";
    if(text) copyText(text, label);
    e.stopPropagation();
    return;
  }
  const navBtn = e.target.closest(".nav-btn");
  if(navBtn){
    switchScreen(navBtn.dataset.target);
  }
});

$("#open-search").addEventListener("click", openSearch);
$("#close-search").addEventListener("click", closeSearch);
$("#search-modal").addEventListener("click", (e) => {
  if(e.target.id === "search-modal") closeSearch();
});
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape" && $("#search-modal").classList.contains("open")) closeSearch();
  if((e.key === "k" || e.key === "K") && (e.metaKey || e.ctrlKey)){
    e.preventDefault();
    openSearch();
  }
});
$("#global-search").addEventListener("input", (e) => renderGlobalSearchResults(e.target.value));

/* ===============================================================
   INIT
=============================================================== */
renderToday();
renderDays();
renderStays();
renderLogistics();
renderEats();
</script>
</body>
